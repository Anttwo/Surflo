# @package _global_
#
# Canonical variable-view curriculum run (4 GPUs) over the orbit-shot subset.
# View count N is drawn per iteration over [2 .. 16]; the batch is a fixed
# 3 scenes/GPU (max_img_per_gpu // n_max_views = 48 // 16). Cull-radius follows
# a power-law curriculum on [1.0, 3.0], pinned toward 1.0, annealed over
# 20 epochs.
defaults:
  - override /data: multiview

exp_name: surflo_curriculum_2to16views_orbitshot_4gpu

num_val_scenes: 100
max_img_per_gpu: 48
img_nums: [2, 16]
max_epochs: 201

limit_train_batches: 2500
limit_val_batches: 2
slow_val_epoch_freq: 1000000
ood_val_epoch_freq: 1

cull_radius: [1.0, 3.0]

# Cull-radius curriculum (train split only).
cull_curriculum_warmup_epochs: 20
cull_curriculum_law: "power"
cull_curriculum_k_init: 3.0
cull_curriculum_alpha_init: 3.0
cull_curriculum_mode: 1.0
cull_curriculum_max_progress: 0.85

# Scene whitelist asset (relative to the training working directory).
scene_whitelist: data/lists/orbitshot_scenes.txt
