# Optimizer + fvcore `where`-driven LR/WD schedulers + EMA + AMP + grad clip.
#
# This is the merged, canonical optimizer config for both released runs (AdamW,
# LR warmup 1e-8 -> 5e-4 then cosine 5e-4 -> 5e-5, constant WD, EMA beta 0.9999,
# bf16 AMP, gradient clipping restricted to `surface_net`).
param_group_modifiers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-4
  weight_decay: 0.01

ema:
  enabled: true
  model:
    _target_: ema_pytorch.EMA
    beta: 0.9999
    update_after_step: 100
    update_every: 1
    allow_different_devices: true
    include_online_model: false

amp:
  enabled: True
  amp_dtype: bfloat16

gradient_clip:
  _target_: utils.gradient_clip.GradientClipper
  configs:
    - module_name: ["surface_net"]
      max_norm: 1.0
      norm_type: 2

options:
  lr:
    - scheduler:
        _target_: fvcore.common.param_scheduler.CompositeParamScheduler
        schedulers:
          - _target_: fvcore.common.param_scheduler.LinearParamScheduler
            start_value: 1e-8
            end_value: 5e-4
          - _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: 5e-4
            end_value: 5e-5
        lengths: [0.003, 0.997]
        interval_scaling: ['rescaled', 'rescaled']
  weight_decay:
    - scheduler:
        _target_: fvcore.common.param_scheduler.ConstantParamScheduler
        value: 0.01
